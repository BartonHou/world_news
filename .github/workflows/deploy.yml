name: Refresh data and deploy to Pages

on:
  # Regenerate country cards weekly (Mondays 08:00 UTC). This is a portfolio
  # project, not a live news wire — weekly keeps API cost near zero and the
  # data still feels fresh. Trigger manually anytime via "Run workflow".
  schedule:
    - cron: "0 8 * * 1"
  # Manual "Run workflow" button.
  workflow_dispatch: {}
  # Deploy (using already-committed data) whenever main changes.
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # On schedule / manual runs, pull fresh signals and rebuild the JSON.
      # On a plain push we skip this and just deploy the committed data (fast,
      # no API cost).
      - name: Refresh data (probe + export)
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Read-only Reddit OAuth so the datacenter runner isn't IP-blocked.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          python scripts/probe.py --output-dir outputs/phase0
          python scripts/export_phase1_data.py

      # Assemble only the static site (index.html + public/), leaving scripts,
      # plans, and raw outputs out of the public deploy.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r public _site/public

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
